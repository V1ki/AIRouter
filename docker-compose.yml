version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_router_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_router
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai_router:
    build: .
    container_name: ai_router_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_router
      INIT_COMMON_PROVIDERS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data: